# Zabbix SLA Report Configuration

zabbix:
  url: ""
  token: ""
  # Optional local token file, resolved relative to this config.
  # Keep credentials in an ignored file such as .zabbix-api-token.
  token_file: ""

# Default SLA settings (used if group doesn't have its own)
default_sla_threshold: 99.9
default_orange_threshold: 5.0

# Report generation mode:
# - "combined": All groups in one Excel file with separate sheets (default)
# - "separate": Each group gets its own Excel file
report_mode: "separate"

# Host groups configuration
# Each group can have its own SLA threshold, or use the default
# Format:
#   group_name:
#     sla_threshold: 99.99  (optional, uses default if not specified)
#     orange_threshold: 5.0  (optional, uses default if not specified)
#     excluded_hosts: []     (optional, hosts to exclude for this group only)

host_groups:
  "Example Group":
    sla_threshold: 99.99
    orange_threshold: 5.0
    # Optional company schedule; omitted schedules inherit the global setting.
    # sla_calculation:
    #   business_hours:
    #     enabled: true
    #     timezone: "UTC"
    #     weekdays: [0, 1, 2, 3, 4]
    #     start: "08:00"
    #     end: "17:00"
    excluded_hosts: []
      # - "test-device-1"

  # Example additional groups - uncomment and configure as needed:
  #
  # "Linux servers":
  #   sla_threshold: 99.9
  #   orange_threshold: 5.0
  #
  # "Windows servers":
  #   sla_threshold: 99.5
  #   orange_threshold: 5.0
  #
  # "Network devices":
  #   sla_threshold: 99.99
  #   orange_threshold: 3.0
  #
  # "Critical Infrastructure":
  #   sla_threshold: 99.999
  #   orange_threshold: 2.0

# Global excluded hosts (excluded from ALL groups)
global_excluded_hosts:
  # - "test-server-01"
  # - "maintenance-device"


# Automatically retain generated reports and their trend data in local report history.
auto_save_reports: true

# Output settings
output:
  filename_prefix: "SLA_Report"
  include_timestamp: true
  # Output directory (optional, defaults to current directory)
  # output_dir: "/path/to/reports"

# Monthly usage for interfaces whose configured description matches this regex.
# Matching is case-insensitive. Change this to your own naming convention.
link_usage:
  enabled: true
  description_regex: 'EXAMPLE_LINK_DESCRIPTION'
  # Trend window: 3 = last quarter, 6 = last six months, 12 = last year.
  # Complete calendar months to compare (1–12).
  history_months: 3
  # Suppress growth percentages if either month has less hourly coverage.
  growth_min_coverage_pct: 90

# Keep browser logins across refreshes and restarts (1–90 days).
auth:
  remember_days: 7

# SLA rules: business-hour filtering is disabled until you set your schedule.
sla_calculation:
  minimum_outage_seconds: 0  # Ignore outages shorter than this many seconds; 0 counts all.
  business_hours:
    enabled: false
    timezone: 'UTC'
    weekdays: [0, 1, 2, 3, 4]  # 0=Monday, 6=Sunday
    start: '09:00'
    end: '17:00'
